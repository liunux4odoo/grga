<!DOCTYPE html>
${generation_header}
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --border: #d9dde3;
    --ink: #1c2330;
    --muted: #667085;
    --kw: #2f6fed;
    --file: #17a06e;
    --head: #b5561c;
    --other: #8a8f98;
    --llm: #9146d6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: system-ui, sans-serif;
    color: var(--ink); background: var(--bg);
  }
  #app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- Timeline (top) ---- */
  #timeline {
    flex: 0 0 auto;
    padding: 10px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  #timeline h1 {
    font-size: 15px; margin: 0 0 8px 0; font-weight: 600;
  }
  #timeline h1 .ver { color: var(--muted); font-weight: 400; font-size: 12px; }
  .slider-row { display: flex; align-items: center; gap: 12px; }
  #stepSlider { flex: 1 1 auto; }
  #playBtn, #fitBtn {
    border: 1px solid var(--border); background: #fff; color: var(--ink);
    border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 13px;
  }
  #playBtn:hover, #fitBtn:hover { background: #eef1f6; }
  #stepInfo {
    margin-top: 6px; font-size: 13px; color: var(--muted);
    min-height: 18px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  #stepInfo b { color: var(--ink); }
  .verb-tag {
    display: inline-block; padding: 1px 7px; border-radius: 10px;
    font-size: 11px; font-weight: 600; color: #fff; margin-right: 6px;
  }
  .verb-related { background: #2f6fed; }
  .verb-suggest { background: #9146d6; }

  /* ---- Main row (canvas + detail) ---- */
  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  #cy { flex: 1 1 72%; min-width: 0; background: var(--bg); }
  #side {
    flex: 0 0 28%; max-width: 340px; min-width: 240px;
    border-left: 1px solid var(--border); background: var(--panel);
    display: flex; flex-direction: column; overflow: hidden;
  }

  .side-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
  .side-section h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); margin: 0 0 8px 0;
  }

  /* ---- Legend ---- */
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 12px; margin: 5px 0; }
  .swatch { width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto; }
  .swatch.kw { background: var(--kw); }
  .swatch.file { background: var(--file); border-radius: 3px; }
  .swatch.head { background: var(--head); transform: rotate(45deg); border-radius: 2px; }
  .swatch.other { background: var(--other); }
  .line-swatch { width: 26px; height: 0; flex: 0 0 auto; }
  .line-solid { border-top: 3px solid #555; }
  .line-dashed { border-top: 3px dashed var(--llm); }
  .ring-swatch {
    width: 16px; height: 16px; border-radius: 50%; flex: 0 0 auto;
    background: #fff; border: 3px solid var(--kw);
  }

  /* ---- Detail panel ---- */
  #detail { flex: 1 1 auto; overflow: auto; padding: 12px 14px; }
  #detail .empty { color: var(--muted); font-size: 13px; }
  #detail .title {
    font-size: 14px; font-weight: 600; word-break: break-all; margin-bottom: 8px;
  }
  #detail table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #detail td { padding: 3px 4px; vertical-align: top; border-bottom: 1px solid #eef0f3; }
  #detail td.k { color: var(--muted); white-space: nowrap; width: 40%; }
  #detail td.v { word-break: break-word; font-family: ui-monospace, monospace; }
  .badge {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px;
    background: #eef1f6; color: var(--muted); margin-left: 6px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="timeline">
    <h1>${title} <span class="ver" id="verLabel"></span></h1>
    <div class="slider-row">
      <button id="playBtn" title="Play / pause step-by-step replay">Play</button>
      <input type="range" id="stepSlider" min="1" max="1" value="1" step="1">
      <button id="fitBtn" title="Fit graph to viewport">Fit</button>
    </div>
    <div id="stepInfo"></div>
  </div>
  <div id="main">
    <div id="cy"></div>
    <div id="side">
      <div class="side-section">
        <h2>Legend</h2>
        <div class="legend-item"><span class="swatch kw"></span> keyword (<code>kw:</code>)</div>
        <div class="legend-item"><span class="swatch file"></span> file (<code>file:</code>)</div>
        <div class="legend-item"><span class="swatch head"></span> heading (<code>head:</code>)</div>
        <div class="legend-item"><span class="line-swatch line-solid"></span> traverse_edge</div>
        <div class="legend-item"><span class="line-swatch line-dashed"></span> llm_propose</div>
        <div class="legend-item"><span class="ring-swatch"></span> score_node (border = PPR score)</div>
      </div>
      <div class="side-section" style="flex:0 0 auto;">
        <h2>Details</h2>
      </div>
      <div id="detail"><div class="empty">Click a node or edge to inspect its metadata.</div></div>
    </div>
  </div>
</div>

<script>
${cytoscape_js}
</script>
<script>
window.__TRACE__ = ${trace_data_json};
</script>
<script>
(function () {
  "use strict";
  var TRACE = window.__TRACE__ || {};
  var steps = TRACE.steps || [];
  var nodes = TRACE.nodes || [];
  var edges = TRACE.edges || [];
  var maxStep = TRACE.max_step || 1;
  if (maxStep < 1) { maxStep = 1; }

  // O(1) step lookup: the slider fires many times per drag, so we index
  // steps up front instead of scanning the array on every tick.
  var stepIndex = new Map();
  for (var si = 0; si < steps.length; si++) { stepIndex.set(steps[si].step, steps[si]); }

  document.getElementById("verLabel").textContent =
    "trace_signals v" + (TRACE.trace_signals_version || "?");

  var KIND_COLOR = { kw: "#2f6fed", file: "#17a06e", head: "#b5561c", other: "#8a8f98" };
  var KIND_SHAPE = { kw: "ellipse", file: "round-rectangle", head: "diamond", other: "hexagon" };

  // Best score per node (max), used for border width / halo.
  function bestScore(node) {
    var s = node.scores || [];
    var best = null;
    for (var i = 0; i < s.length; i++) {
      var v = s[i].score;
      if (typeof v === "number" && (best === null || v > best)) { best = v; }
    }
    return best;
  }

  var cyNodes = nodes.map(function (n) {
    var score = bestScore(n);
    return {
      data: {
        id: n.id,
        label: n.id.replace(/^([a-z]+):/, ""),
        kind: n.kind,
        firstStep: n.first_step,
        score: score,
        borderW: score === null ? 1 : (2 + Math.round(score * 10)),
        raw: n
      }
    };
  });

  var cyEdges = edges.map(function (e, idx) {
    return {
      data: {
        id: "e" + idx,
        source: e.source,
        target: e.target,
        edgeKind: e.edge_kind,
        op: e.op,
        lineStyle: e.style === "dashed" ? "dashed" : "solid",
        firstStep: e.first_step,
        weight: e.weight,
        raw: e
      }
    };
  });

  var cy = cytoscape({
    container: document.getElementById("cy"),
    elements: { nodes: cyNodes, edges: cyEdges },
    wheelSensitivity: 0.2,
    style: [
      {
        selector: "node",
        style: {
          "background-color": function (n) { return KIND_COLOR[n.data("kind")] || KIND_COLOR.other; },
          "shape": function (n) { return KIND_SHAPE[n.data("kind")] || "ellipse"; },
          "label": "data(label)",
          "font-size": 10,
          "color": "#1c2330",
          "text-valign": "bottom",
          "text-margin-y": 3,
          "text-wrap": "ellipsis",
          "text-max-width": 90,
          "width": 22, "height": 22,
          "border-width": "data(borderW)",
          "border-color": "#f2a900"
        }
      },
      {
        selector: "edge",
        style: {
          "width": function (e) { var w = e.data("weight"); return (typeof w === "number") ? (1 + w * 4) : 1.5; },
          "line-color": function (e) { return e.data("op") === "llm_propose" ? "#9146d6" : "#8a93a3"; },
          "line-style": "data(lineStyle)",
          "curve-style": "bezier",
          "target-arrow-shape": "none",
          "opacity": 0.85
        }
      },
      { selector: ".dim", style: { "opacity": 0.08, "text-opacity": 0.0 } },
      { selector: "node.dim", style: { "opacity": 0.08 } },
      { selector: ".sel", style: { "border-color": "#e11d48", "border-width": 4, "line-color": "#e11d48", "opacity": 1 } }
    ],
    // Layout choice: `cose` is a spring-embedder that becomes unusable
    // (browser tab freezes for tens of seconds) past a few thousand
    // nodes. Fall back to `grid` at scale — it is not as pretty but it
    // stays navigable, and the contract targets >10k-action traces.
    layout: (cyNodes.length > 1500)
      ? { name: "grid", fit: true, padding: 20 }
      : { name: "cose", animate: false, padding: 30, nodeRepulsion: 6000, idealEdgeLength: 90 }
  });

  // ---- Timeline logic ----
  function applyStep(step) {
    cy.batch(function () {
      cy.nodes().forEach(function (n) {
        if (n.data("firstStep") > step) { n.addClass("dim"); } else { n.removeClass("dim"); }
      });
      cy.edges().forEach(function (e) {
        if (e.data("firstStep") > step) { e.addClass("dim"); } else { e.removeClass("dim"); }
      });
    });
    renderStepInfo(step);
  }

  function summariseArgs(args) {
    if (!args) { return ""; }
    var bits = [];
    if (args.mode) { bits.push("mode=" + args.mode); }
    if (args.intent) { bits.push("intent=" + args.intent); }
    if (args.seeds && args.seeds.length) { bits.push("seeds=[" + args.seeds.join(", ") + "]"); }
    if (args.directory) { bits.push("-d " + args.directory); }
    return bits.join("  ");
  }

  function stepRecord(step) {
    return stepIndex.get(step) || null;
  }

  function renderStepInfo(step) {
    var rec = stepRecord(step);
    var el = document.getElementById("stepInfo");
    if (!rec) {
      el.innerHTML = "step " + step + " (no record at this exact step number)";
      return;
    }
    var actionCount = (rec.actions || []).length;
    var tag = "<span class='verb-tag verb-" + rec.verb + "'>" + rec.verb + "</span>";
    var expanded = actionCount === 0 ? "<span class='badge'>no expansion</span>" : (actionCount + " action(s)");
    el.innerHTML = "<b>step " + rec.step + "</b> \u00b7 " + (rec.ts || "") + " " + tag +
      escapeHtml(summariseArgs(rec.args)) + " " + expanded;
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) { return ""; }
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // ---- Detail panel ----
  function kvRows(obj) {
    var rows = "";
    var keys = Object.keys(obj || {});
    keys.sort();
    for (var i = 0; i < keys.length; i++) {
      var v = obj[keys[i]];
      var disp = (typeof v === "object") ? JSON.stringify(v) : String(v);
      rows += "<tr><td class='k'>" + escapeHtml(keys[i]) + "</td><td class='v'>" + escapeHtml(disp) + "</td></tr>";
    }
    return rows;
  }

  function showNode(n) {
    var raw = n.data("raw") || {};
    var html = "<div class='title'>" + escapeHtml(decodeMaybe(raw.id)) + "</div>";
    html += "<table>";
    html += "<tr><td class='k'>kind</td><td class='v'>" + escapeHtml(raw.kind) + "</td></tr>";
    html += "<tr><td class='k'>first_step</td><td class='v'>" + escapeHtml(raw.first_step) + "</td></tr>";
    var sc = raw.scores || [];
    if (sc.length) {
      html += "<tr><td class='k'>scores</td><td class='v'></td></tr>";
      for (var i = 0; i < sc.length; i++) {
        html += "<tr><td class='k'>&nbsp;step " + escapeHtml(sc[i].step) + "</td><td class='v'>" +
          escapeHtml(sc[i].algo) + "=" + escapeHtml(sc[i].score) +
          " (hops=" + escapeHtml(sc[i].hops_from_seed) + ")</td></tr>";
      }
      if (typeof raw.scores_dropped === "number" && raw.scores_dropped > 0) {
        html += "<tr><td class='k'>&nbsp;</td><td class='v'><span class='badge'>+" +
          escapeHtml(raw.scores_dropped) + " older observations dropped</span></td></tr>";
      }
    }
    html += "</table>";
    document.getElementById("detail").innerHTML = html;
  }

  function decodeMaybe(s) {
    try { return decodeURIComponent(s); } catch (e) { return s; }
  }

  function showEdge(e) {
    var raw = e.data("raw") || {};
    var html = "<div class='title'>" + escapeHtml(decodeMaybe(raw.source)) + " \u2014 " + escapeHtml(decodeMaybe(raw.target)) + "</div>";
    html += "<table>";
    html += "<tr><td class='k'>op</td><td class='v'>" + escapeHtml(raw.op) + "</td></tr>";
    html += "<tr><td class='k'>edge_kind</td><td class='v'>" + escapeHtml(raw.edge_kind) + "</td></tr>";
    html += "<tr><td class='k'>weight</td><td class='v'>" + escapeHtml(raw.weight) + "</td></tr>";
    html += "<tr><td class='k'>first_step</td><td class='v'>" + escapeHtml(raw.first_step) + "</td></tr>";
    if (raw.rationale) {
      html += "<tr><td class='k'>rationale</td><td class='v'>" + escapeHtml(raw.rationale) + "</td></tr>";
    }
    html += "</table>";
    document.getElementById("detail").innerHTML = html;
  }

  cy.on("tap", "node", function (evt) {
    cy.elements().removeClass("sel");
    evt.target.addClass("sel");
    showNode(evt.target);
  });
  cy.on("tap", "edge", function (evt) {
    cy.elements().removeClass("sel");
    evt.target.addClass("sel");
    showEdge(evt.target);
  });
  cy.on("tap", function (evt) {
    if (evt.target === cy) {
      cy.elements().removeClass("sel");
      document.getElementById("detail").innerHTML =
        "<div class='empty'>Click a node or edge to inspect its metadata.</div>";
    }
  });

  // ---- Slider wiring ----
  var slider = document.getElementById("stepSlider");
  slider.max = String(maxStep);
  slider.value = String(maxStep);
  slider.addEventListener("input", function () { applyStep(parseInt(slider.value, 10)); });

  document.getElementById("fitBtn").addEventListener("click", function () { cy.fit(cy.elements(":visible"), 40); });

  // ---- Play button (default OFF; no autoplay) ----
  var timer = null;
  var playBtn = document.getElementById("playBtn");
  playBtn.addEventListener("click", function () {
    if (timer) {
      clearInterval(timer); timer = null; playBtn.textContent = "Play";
      return;
    }
    var cur = parseInt(slider.value, 10);
    if (cur >= maxStep) { cur = 0; }
    playBtn.textContent = "Pause";
    timer = setInterval(function () {
      cur += 1;
      if (cur > maxStep) { clearInterval(timer); timer = null; playBtn.textContent = "Play"; return; }
      slider.value = String(cur);
      applyStep(cur);
    }, 900);
  });

  // Initial render: show full accumulated state.
  applyStep(maxStep);
  cy.fit(cy.elements(), 40);
})();
</script>
</body>
</html>
