<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>grga 搜索会话可视化 · 凡人·草原元婴悖论</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
       background: #eceff1; color: #263238; font-size: 13px; }

.app { display: flex; width: 100vw; height: 100vh; }

/* -------- sidebar -------- */
.sidebar { width: 320px; flex-shrink: 0; background: #263238; color: #eceff1;
           overflow-y: auto; padding: 14px 16px; }
.sidebar h1 { font-size: 15px; margin: 0 0 4px 0; font-weight: 600; color: #fff; }
.sidebar .sub { font-size: 11.5px; opacity: 0.7; margin-bottom: 14px; }
.sidebar section { margin-bottom: 12px; padding: 10px 12px;
                   background: #37474f; border-radius: 5px; }
.sidebar section h3 { margin: 0; font-size: 12.5px; color: #fff; font-weight: 600;
                      display: flex; justify-content: space-between; align-items: center;
                      cursor: pointer; user-select: none; }
.sidebar section h3 .caret { font-size: 10px; opacity: 0.7; transition: transform 0.2s; }
.sidebar section.collapsed h3 .caret { transform: rotate(-90deg); }
.sidebar section .body { font-size: 12px; line-height: 1.65; color: #cfd8dc;
                         margin-top: 8px; }
.sidebar section.collapsed .body { display: none; }
.sidebar section .body b { color: #eceff1; }
.sidebar section .body ul { padding-left: 18px; margin: 6px 0; }
.sidebar section .body ul li { margin-bottom: 6px; }
.sidebar section .body code { background: #263238; color: #ffd54f;
                              padding: 1px 5px; border-radius: 3px;
                              font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; }
.stat { display: inline-block; padding: 2px 8px; margin: 2px 4px 2px 0;
        background: #455a64; border-radius: 10px; font-size: 11px; color: #cfd8dc; }
.stat.bad { background: #c0392b; color: #fff; }
.stat.good { background: #2e7d32; color: #fff; }
.stat.gold { background: #f57f17; color: #fff; }
.swatch { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px;
          color: #cfd8dc; margin: 2px 8px 2px 0; }
.swatch .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.swatch .marker { display: inline-flex; align-items: center; justify-content: center;
                  width: 18px; height: 18px; background: #607d8b; color: #fff;
                  border-radius: 50%; font-size: 11px; font-weight: bold; }
.legend-note { font-size: 11px; color: #90a4ae; margin-top: 6px; line-height: 1.5; }

/* -------- chart area -------- */
.chart { flex: 1; display: grid; position: relative;
         grid-template-columns: var(--yaxis-w, 46px) 1fr;
         grid-template-rows:    var(--header-h, 46px) 1fr;
         background: #fff; overflow: hidden; }
.chart-corner { grid-column: 1; grid-row: 1; background: #eceff1;
                border-right: 1px solid #cfd8dc; border-bottom: 1px solid #cfd8dc; }
.chart-header { grid-column: 2; grid-row: 1; overflow: hidden;
                background: #f7f9fb; border-bottom: 1px solid #cfd8dc; position: relative; }
.chart-yaxis  { grid-column: 1; grid-row: 2; overflow: hidden;
                background: #fafbfc; border-right: 1px solid #cfd8dc; position: relative; }
.chart-main   { grid-column: 2; grid-row: 2; overflow: hidden;
                background: #fff; position: relative; cursor: grab; }
.chart-main.dragging { cursor: grabbing; }
.chart-main svg, .chart-header svg, .chart-yaxis svg {
  display: block; position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
}

.toolbar { position: absolute; right: 12px; bottom: 12px; z-index: 20;
           background: #fff; border: 1px solid #cfd8dc; border-radius: 4px;
           box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; overflow: hidden; }
.toolbar button { border: none; background: #fff; padding: 6px 10px;
                  font-size: 13px; color: #37474f; cursor: pointer;
                  font-family: inherit; border-right: 1px solid #eceff1; }
.toolbar button:last-child { border-right: none; }
.toolbar button:hover { background: #eceff1; }
.toolbar .zoom-label { padding: 6px 8px; font-size: 11.5px; color: #607d8b;
                       min-width: 48px; text-align: center; background: #f7f9fb; }
.hint-strip { position: absolute; left: 12px; bottom: 12px; z-index: 15;
              font-size: 11px; color: #78909c; background: rgba(255,255,255,0.9);
              padding: 4px 8px; border-radius: 4px; border: 1px solid #eceff1; }

/* -------- tooltip -------- */
#tooltip { position: fixed; z-index: 1000; pointer-events: none;
           background: #263238; color: #fff; padding: 12px 14px; border-radius: 6px;
           max-width: 340px; font-size: 12.5px; line-height: 1.55;
           box-shadow: 0 4px 14px rgba(0,0,0,0.25); display: none; }
#tooltip.pinned { pointer-events: auto; }
#tooltip .row { margin-top: 6px; }
#tooltip .row:first-child { margin-top: 0; }
#tooltip .k { color: #90a4ae; font-size: 10.5px; text-transform: uppercase;
              letter-spacing: 0.5px; margin-bottom: 2px; }
#tooltip .v { color: #eceff1; word-break: break-word; }
#tooltip code { background: #37474f; padding: 1px 5px; border-radius: 3px;
                font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; color: #fff; }
#tooltip.gold  { background: linear-gradient(135deg, #f9a825 0%, #f57f17 100%); }
#tooltip.gold code { background: rgba(0,0,0,0.25); }
#tooltip.bad   { background: linear-gradient(135deg, #c0392b 0%, #922b21 100%); }
#tooltip.bad code { background: rgba(0,0,0,0.25); }
#tooltip.good  { background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%); }
#tooltip.good code { background: rgba(0,0,0,0.25); }
#tooltip .pin-hint { color: #90a4ae; font-size: 11px; margin-top: 8px;
                     border-top: 1px solid rgba(255,255,255,0.15); padding-top: 6px; }

.node { cursor: pointer; transition: filter 0.12s ease; }
.node:hover { filter: brightness(1.15); }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <h1><!-- TITLE --></h1>
    <div class="sub"><!-- SUBTITLE --></div>

    <section id="sec-legend" class="collapsed">
      <h3>图例 <span class="caret">▼</span></h3>
      <div class="body">
        <div><b>Query families</b>（列 = 同族查询词）</div>
        <div id="legend-families" style="margin:6px 0;"></div>
        <div style="margin-top:6px;"><b>Step kinds</b>（节点标记）</div>
        <div id="legend-kinds" style="margin:6px 0;"></div>
        <div class="legend-note">
          虚线 = 家族切换 (pivot) · 实线 = 家族内演进<br>
          🟡 金边 = 命中黄金段 · ⚫ 黑边 = 反模式岔路
        </div>
      </div>
    </section>

    <section>
      <h3>会话统计 <span class="caret">▼</span></h3>
      <div class="body">
        <!-- STATS -->
      </div>
    </section>

    <section>
      <h3>路径特征 <span class="caret">▼</span></h3>
      <div class="body">
        <!-- PATH_FEATURES -->
      </div>
    </section>
  </aside>

  <div class="chart" id="chart">
    <div class="chart-corner"></div>
    <div class="chart-header" id="chart-header">
      <!-- SVG_HEADER -->
    </div>
    <div class="chart-yaxis" id="chart-yaxis">
      <!-- SVG_YAXIS -->
    </div>
    <div class="chart-main" id="chart-main">
      <!-- SVG_MAIN -->
    </div>
    <div class="hint-strip">拖动平移 · 滚轮缩放 · 双击复位</div>
    <div class="toolbar">
      <button id="btn-zoom-out" title="缩小">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button id="btn-zoom-in" title="放大">+</button>
      <button id="btn-reset" title="100% 复位">1:1</button>
      <button id="btn-fit" title="适应窗口">⊡</button>
    </div>
  </div>
</div>

<div id="tooltip"></div>

<script>
const DATA = /* DATA_INJECT */ {};
const KIND_LABELS = /* KINDS_INJECT */ {};
const FAMILY_COLORS = /* FAMS_INJECT */ {};
const KIND_MARKERS = /* MARKERS_INJECT */ {};
const DIMS = /* DIMS_INJECT */ {};

document.documentElement.style.setProperty('--yaxis-w', DIMS.yaxis_w + 'px');
document.documentElement.style.setProperty('--header-h', DIMS.header_h + 'px');

/* ---- helpers ---- */
function escape(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---- legend ---- */
const famBox = document.getElementById('legend-families');
Object.keys(FAMILY_COLORS).forEach(f => {
  const el = document.createElement('span');
  el.className = 'swatch';
  el.innerHTML = `<span class="dot" style="background:${FAMILY_COLORS[f]}"></span>${escape(f)}`;
  famBox.appendChild(el);
});
const kindBox = document.getElementById('legend-kinds');
Object.keys(KIND_MARKERS).forEach(k => {
  const el = document.createElement('span');
  el.className = 'swatch';
  el.innerHTML = `<span class="marker">${escape(KIND_MARKERS[k])}</span>${escape(KIND_LABELS[k])}`;
  kindBox.appendChild(el);
});

/* ---- collapsible sections ---- */
document.querySelectorAll('.sidebar section h3').forEach(h => {
  h.addEventListener('click', () => h.parentElement.classList.toggle('collapsed'));
});

/* ---- pan/zoom state ---- */
const CANVAS_W = DIMS.canvas_w, CANVAS_H = DIMS.canvas_h;
const chartMain   = document.getElementById('chart-main');
const svgMain   = document.getElementById('svg-main');
const svgHeader = document.getElementById('svg-header');
const svgYaxis  = document.getElementById('svg-yaxis');
const zoomLabel = document.getElementById('zoom-label');

let panX = 0, panY = 0, zoom = 1;
const ZOOM_MIN = 0.35, ZOOM_MAX = 4;

/* size the SVGs and apply pan translation */
function applyTransform() {
  svgMain.style.width   = (CANVAS_W * zoom) + 'px';
  svgMain.style.height  = (CANVAS_H * zoom) + 'px';
  svgHeader.style.width = (CANVAS_W * zoom) + 'px';
  svgHeader.style.height= DIMS.header_h + 'px';
  svgYaxis.style.width  = DIMS.yaxis_w + 'px';
  svgYaxis.style.height = (CANVAS_H * zoom) + 'px';
  svgMain.style.transform   = `translate(${panX}px, ${panY}px)`;
  svgHeader.style.transform = `translate(${panX}px, 0px)`;
  svgYaxis.style.transform  = `translate(0px, ${panY}px)`;
  zoomLabel.textContent = Math.round(zoom * 100) + '%';
}

function clampPan() {
  const vw = chartMain.clientWidth, vh = chartMain.clientHeight;
  const w = CANVAS_W * zoom, h = CANVAS_H * zoom;
  const margin = 80;
  const minX = Math.min(0, vw - w - margin), maxX = margin;
  const minY = Math.min(0, vh - h - margin), maxY = margin;
  panX = Math.max(minX, Math.min(maxX, panX));
  panY = Math.max(minY, Math.min(maxY, panY));
}

function setZoom(newZoom, focalX, focalY) {
  newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
  if (focalX == null) {
    focalX = chartMain.clientWidth / 2;
    focalY = chartMain.clientHeight / 2;
  }
  const canvasFx = (focalX - panX) / zoom;
  const canvasFy = (focalY - panY) / zoom;
  zoom = newZoom;
  panX = focalX - canvasFx * zoom;
  panY = focalY - canvasFy * zoom;
  clampPan();
  applyTransform();
}

function reset() {
  zoom = 1; panX = 0; panY = 0;
  applyTransform();
}

function fit() {
  const vw = chartMain.clientWidth, vh = chartMain.clientHeight;
  /* 竖版策略：横向铺满，纵向按需滚动。字/节点保持可读大小。 */
  const zHoriz = vw / CANVAS_W;
  /* 但不要缩得太狠：至少 60%（保证节点数字/家族标签可读） */
  /* 也不要放太大：最多 1.15x */
  const z = Math.max(0.6, Math.min(zHoriz, 1.15));
  zoom = z;
  const w = CANVAS_W * z;
  panX = Math.max(0, (vw - w) / 2);
  panY = 0;
  applyTransform();
}

/* ---- pan interaction (drag) ---- */
let isDragging = false, hasMoved = false;
let dragStartX = 0, dragStartY = 0, panStartX = 0, panStartY = 0;
chartMain.addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  isDragging = true; hasMoved = false;
  chartMain.classList.add('dragging');
  dragStartX = e.clientX; dragStartY = e.clientY;
  panStartX = panX; panStartY = panY;
  e.preventDefault();
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
  if (!hasMoved && Math.abs(dx) + Math.abs(dy) > 3) hasMoved = true;
  panX = panStartX + dx;
  panY = panStartY + dy;
  clampPan();
  applyTransform();
  if (pinnedStep === null) tooltip.style.display = 'none';
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  chartMain.classList.remove('dragging');
});

/* ---- wheel zoom ---- */
chartMain.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = chartMain.getBoundingClientRect();
  const fx = e.clientX - rect.left;
  const fy = e.clientY - rect.top;
  const factor = e.deltaY < 0 ? 1.15 : (1 / 1.15);
  setZoom(zoom * factor, fx, fy);
}, { passive: false });

/* ---- toolbar ---- */
document.getElementById('btn-zoom-in').addEventListener('click', () => setZoom(zoom * 1.25));
document.getElementById('btn-zoom-out').addEventListener('click', () => setZoom(zoom / 1.25));
document.getElementById('btn-reset').addEventListener('click', reset);
document.getElementById('btn-fit').addEventListener('click', fit);

/* ---- double click reset ---- */
chartMain.addEventListener('dblclick', () => fit());

/* ---- tooltip ---- */
const tooltip = document.getElementById('tooltip');
let pinnedStep = null;

function tooltipClass(kind, isGold) {
  if (isGold) return 'gold';
  if (kind === 'antipattern') return 'bad';
  if (kind === 'synthesize') return 'good';
  return '';
}

function buildTooltipHtml(s, isPinned) {
  return `
    <div class="row">
      <div class="k">Step ${s.step} · ${escape(s.family)}</div>
      <div class="v"><code>${escape(s.cmd)}</code></div>
    </div>
    <div class="row"><div class="k">类型</div><div class="v">${escape(KIND_LABELS[s.kind] || s.kind)}</div></div>
    <div class="row"><div class="k">信号</div><div class="v">${s.signal == null ? '—' : escape(String(s.signal))}</div></div>
    <div class="row"><div class="k">决策</div><div class="v">${escape(s.decision)}</div></div>
    <div class="row"><div class="k">洞察 / 教训</div><div class="v">${escape(s.insight || '—')}</div></div>
    <div class="pin-hint">${isPinned ? '📌 已 pin · 再点空白或 Esc 取消' : '点击节点可 pin 住此 tooltip'}</div>
  `;
}

function showTooltip(step, clientX, clientY, pinned) {
  const s = DATA[String(step)];
  if (!s) return;
  const isGold = String(s.signal || '').includes('🎯');
  tooltip.className = tooltipClass(s.kind, isGold) + (pinned ? ' pinned' : '');
  tooltip.innerHTML = buildTooltipHtml(s, pinned);
  tooltip.style.display = 'block';
  positionTooltip(clientX, clientY);
}

function positionTooltip(clientX, clientY) {
  const pad = 14;
  const tw = tooltip.offsetWidth, th = tooltip.offsetHeight;
  let x = clientX + pad, y = clientY + pad;
  if (x + tw > window.innerWidth - 10) x = clientX - tw - pad;
  if (y + th > window.innerHeight - 10) y = clientY - th - pad;
  if (x < 8) x = 8; if (y < 8) y = 8;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

function hideTooltip() {
  if (pinnedStep === null) tooltip.style.display = 'none';
}

function pinTooltip(step, clientX, clientY) {
  pinnedStep = step;
  showTooltip(step, clientX, clientY, true);
  document.querySelectorAll('.node').forEach(m => {
    if (m.hasAttribute('data-orig-stroke')) {
      m.setAttribute('stroke', m.getAttribute('data-orig-stroke'));
      m.setAttribute('stroke-width', m.getAttribute('data-orig-sw'));
    }
  });
  const el = document.querySelector('.node[data-step="' + step + '"]');
  if (el) {
    if (!el.hasAttribute('data-orig-stroke')) {
      el.setAttribute('data-orig-stroke', el.getAttribute('stroke'));
      el.setAttribute('data-orig-sw', el.getAttribute('stroke-width'));
    }
    el.setAttribute('stroke', '#e91e63');
    el.setAttribute('stroke-width', '4');
  }
}

function unpin() {
  pinnedStep = null;
  tooltip.style.display = 'none';
  document.querySelectorAll('.node').forEach(m => {
    if (m.hasAttribute('data-orig-stroke')) {
      m.setAttribute('stroke', m.getAttribute('data-orig-stroke'));
      m.setAttribute('stroke-width', m.getAttribute('data-orig-sw'));
    }
  });
}

/* ---- bind nodes ---- */
function bindNodes() {
  document.querySelectorAll('.node').forEach(n => {
    const step = parseInt(n.getAttribute('data-step'));
    n.addEventListener('mouseenter', (evt) => {
      if (pinnedStep === null && !isDragging) showTooltip(step, evt.clientX, evt.clientY, false);
    });
    n.addEventListener('mousemove', (evt) => {
      if (pinnedStep === null && !isDragging) positionTooltip(evt.clientX, evt.clientY);
    });
    n.addEventListener('mouseleave', hideTooltip);
    n.addEventListener('click', (evt) => {
      if (hasMoved) return;  /* don't pin if user was dragging */
      evt.stopPropagation();
      if (pinnedStep === step) unpin();
      else pinTooltip(step, evt.clientX, evt.clientY);
    });
    n.addEventListener('mousedown', (evt) => evt.stopPropagation() || null);
  });
}

/* click outside → unpin */
document.addEventListener('click', (e) => {
  if (pinnedStep !== null && !e.target.closest('.node') && !e.target.closest('#tooltip')) {
    unpin();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && pinnedStep !== null) unpin();
});

/* ---- init ---- */
bindNodes();
window.addEventListener('resize', () => { clampPan(); applyTransform(); });
/* Wait for grid layout to settle so chartMain.clientWidth is correct */
function initFit() {
  if (chartMain.clientWidth < 100) {
    setTimeout(initFit, 50);
    return;
  }
  fit();
}
setTimeout(initFit, 50);
</script>
</body>
</html>
