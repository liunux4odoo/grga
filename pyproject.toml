[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grga"
version = "0.1.0"
description = "A CLI and Tkinter GUI for ripgrep-all search"
requires-python = ">=3.8"
authors = [{ name = "grga maintainers" }]
keywords = ["ripgrep", "rga", "search", "gui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Desktop Environment",
    "Topic :: Text Processing :: Indexing",
]
dependencies = ["typer>=0.9", "openai>=1.0"]

[project.optional-dependencies]
standalone = ["pyinstaller>=6.0"]
test = ["pytest>=7.0"]
v2 = ["markdown-it-py>=3.0"]

[project.scripts]
grga = "grga.cli:main"
grga-gui = "grga.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grga = ["data/tools/**/*", "prompts/*.txt"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
