[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grga"
version = "0.3.0"
description = "A CLI and Tkinter GUI for ripgrep-all search with L2 graph index and LLM-assisted deep search"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "grga maintainers" }]
keywords = ["ripgrep", "rga", "search", "gui", "cli", "llm", "graph"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = ["typer>=0.9", "openai>=1.0", "jieba>=0.42", "markdown-it-py>=3.0"]

[project.urls]
Homepage = "https://github.com/liunux4odoo/grga"
Repository = "https://github.com/liunux4odoo/grga"
Documentation = "https://github.com/liunux4odoo/grga#readme"
Changelog = "https://github.com/liunux4odoo/grga/blob/main/CHANGELOG.md"
Issues = "https://github.com/liunux4odoo/grga/issues"

[project.optional-dependencies]
standalone = ["pyinstaller>=6.0"]
test = ["pytest>=7.0"]
mcp = ["mcp>=1.0"]

[project.scripts]
grga = "grga.cli:main"
grga-gui = "grga.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grga = [
    "prompts/*.txt",
    "prompts/**/*.txt",
    "skills/**/*",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
